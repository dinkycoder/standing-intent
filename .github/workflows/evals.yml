name: evals

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  harness-tests:
    # GATING. The deterministic harness + grading unit tests. A failure here
    # fails the build. This is the whole point of the gate: it proves the
    # harness does not lie to itself.
    #
    # Note: tests/test_payments_seller.py (unmarked) starts a local Flask server
    # and reaches x402.org/facilitator for its /supported list. It degrades to a
    # skip on a third-party outage (never red), so the job stays green, but it is
    # not purely offline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -v

  stub-eval-report:
    # REPORTING ONLY - does NOT gate the build.
    #
    # The stub agent is expected to score pass^1 = 0%. That is correct, not a
    # failure. Do NOT add a pass-rate threshold, --min-pass flag, or an assert
    # on report.pass_* to this job. See CLAUDE.md and
    # docs/superpowers/specs/2026-09-02-eval-harness-design.md.
    #
    # A non-stub agent (claude-planner-v1) IS registered as of Week 5, and no
    # gate was added for it -- deliberately. It makes real, billed Claude API
    # calls and needs ANTHROPIC_API_KEY, which CI does not have, so gating on
    # it would mean either a paid CI run per push or a secret in CI. It runs
    # instead via a separate, manual, non-CI-gated script,
    # scripts/run_claude_planner_evals.py, whose results are recorded by hand
    # in docs/week5-claude-planner-live-run.md.
    needs: harness-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/run_stub_evals.py
      - uses: actions/upload-artifact@v4
        with:
          name: stub-eval-results
          path: evals/results/
